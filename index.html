<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Heeseo — Intro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- 좌우 세로 고정 텍스트 -->
    <div class="side-label side-label--left" aria-hidden="true">
      <span class="side-label__kicker">Now Playing</span>
      <span class="side-label__song" data-side-song></span>
    </div>
    <div class="side-label side-label--right" aria-hidden="true">
      <span class="side-label__kicker">Now Playing</span>
      <span class="side-label__song" data-side-song></span>
    </div>

    <main class="page">
      <div class="bento">
        <!-- 1번: 플레이리스트 -->
        <section class="widget widget--playlist" aria-label="플레이리스트">
          <div class="playlist">
            <header class="playlist__header">
              <h1 class="playlist__title" id="playlist-title">
                <span class="playlist__title-line">The Bear</span>
                <span class="playlist__title-line">Official Playlist</span>
              </h1>
            </header>

            <ul class="playlist__list" id="playlist">
              <!-- script.js가 곡 목록을 여기에 채웁니다 -->
            </ul>
          </div>

          <audio id="audio" preload="metadata"></audio>
        </section>

        <!-- 2·3번: 플립 시계 (시 / 분) -->
        <section class="widget widget--2 widget--clock" aria-label="시">
          <div class="flip" id="flip-hours" aria-live="polite">
            <div class="flip__base flip__base--top"><span>00</span></div>
            <div class="flip__base flip__base--bottom"><span>00</span></div>
            <div class="flip__flap flip__flap--top"><span>00</span></div>
            <div class="flip__flap flip__flap--bottom"><span>00</span></div>
          </div>
        </section>
        <section class="widget widget--3 widget--clock" aria-label="분">
          <div class="flip" id="flip-minutes" aria-live="polite">
            <div class="flip__base flip__base--top"><span>00</span></div>
            <div class="flip__base flip__base--bottom"><span>00</span></div>
            <div class="flip__flap flip__flap--top"><span>00</span></div>
            <div class="flip__flap flip__flap--bottom"><span>00</span></div>
          </div>
        </section>

        <!-- 4~8번: 나중에 자기소개 내용 채울 자리 -->
        <section class="widget widget--4 widget--transport" aria-label="재생 컨트롤러">
          <div class="transport-wrap" id="transport-wrap">
            <svg class="transport__progress" viewBox="0 0 100 100" aria-hidden="true">
              <circle class="transport__track" cx="50" cy="50" r="49" />
              <circle
                class="transport__bar"
                id="progress-bar"
                cx="50"
                cy="50"
                r="49"
              />
            </svg>
            <button
              type="button"
              class="transport"
              id="transport-btn"
              aria-label="재생"
            >
              <img
                class="transport__arrow"
                id="transport-arrow"
                src="assets/images/arrow.svg?v=2"
                alt=""
                aria-hidden="true"
              />
              <img
                class="transport__icon transport__icon--play"
                id="transport-play"
                src="assets/images/play.svg?v=2"
                alt=""
                aria-hidden="true"
                hidden
              />
              <img
                class="transport__icon transport__icon--pause"
                id="transport-pause"
                src="assets/images/stop.svg?v=2"
                alt=""
                aria-hidden="true"
                hidden
              />
            </button>
          </div>
        </section>
        <section class="widget widget--5" aria-label="위젯 5"></section>
        <section class="widget widget--6" aria-label="위젯 6">
          <div class="quad">
            <button type="button" class="quad__cell is-dimmed" aria-pressed="false" aria-label="칸 1">
              <img class="quad__icon" src="assets/images/coffee.svg" alt="" aria-hidden="true" />
            </button>
            <button type="button" class="quad__cell is-dimmed" aria-pressed="false" aria-label="칸 2">
              <img class="quad__icon" src="assets/images/coffee.svg" alt="" aria-hidden="true" />
            </button>
            <button type="button" class="quad__cell is-dimmed" aria-pressed="false" aria-label="칸 3">
              <img class="quad__icon" src="assets/images/coffee.svg" alt="" aria-hidden="true" />
            </button>
            <button type="button" class="quad__cell is-dimmed" aria-pressed="false" aria-label="칸 4">
              <img class="quad__icon" src="assets/images/coffee.svg" alt="" aria-hidden="true" />
            </button>
          </div>
        </section>
        <section class="widget widget--7" aria-label="손">
          <img
            class="widget__image"
            src="assets/images/hand.svg"
            alt="손"
          />
        </section>
        <section class="widget widget--8" aria-label="책">
          <img
            class="widget__image"
            src="assets/images/book.svg"
            alt="책"
          />
        </section>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
